[project]
name = "flatlandian"
version = "0.2.4"
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "pygame-ce>=2.5.8",
    "vec>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
future-annotations = true
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma: conflicts with ruff formatter
    "CPY001", # missing-copyright-notice
    "D105", # undocumented-magic-method
    "S311", # suspicious-non-cryptographic-random-usage
]

# Allow 'unsafe' fixes:
extend-safe-fixes = [
    "TC", # flake8-type-checking
]

[tool.ruff.lint.per-file-ignores]
# Not relevant in tests:
"tests/*" = [
    "D103", # undocumented-public-function
    "S101", # assert
    "PLR2004", # magic-value-comparison
]
"src/vec/*" = [
    "ANN", # Not relevant in incomplete stubs
    "N804"  # pep-8-naming
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
resolution = "lowest-direct"

[tool.pyrefly]
preset = "strict"
